<div class="social">
  <ul>
    {{ range .Site.Params.social }}
    <li>
      <a href="{{ .url }}" aria-label="{{ .name }}">
        {{ if .icon }}
        <i class="{{ .icon }}" aria-hidden="true"></i>
        {{ else if .image }}
        <img src="{{ .image | relURL }}" alt="{{ .name }}" style="height: 1.2em; vertical-align: middle;" />
        {{ else }}
        {{ .name }}
        {{ end }}
      </a>
    </li>
    {{ end }}
  </ul>
</div>
